substitutions:
  name: "countdown_timer_crowpanel"
  friendly_name: "Countdown Timer Crowpanel 2.8inch"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# captive_portal not supported with esp-idf framework

# --- SPI Bus (shared by display and touchscreen) ---
spi:
  id: spi_bus
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

# --- Backlight Control ---
output:
  - platform: ledc
    pin: GPIO27
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

# --- ILI9341 Display (240x320 native, hardware-rotated to landscape) ---
display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: spi_bus
    cs_pin: GPIO15
    dc_pin: GPIO2
    color_order: RGB
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never
    id: crowpanel_display

# --- Resistive Touchscreen (XPT2046) ---
touchscreen:
  - platform: xpt2046
    spi_id: spi_bus
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    id: crowpanel_touch
    calibration:
      x_min: 220
      x_max: 3756
      y_min: 394
      y_max: 3749
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true

# --- Import timer sensor from Home Assistant ---
sensor:
  - platform: homeassistant
    id: gaming_pc_timer
    entity_id: sensor.gaming_pc_2_on_time
    on_value:
      then:
        # Format decimal hours (e.g. 1.5) as H:MM:SS for display
        - lvgl.label.update:
            id: timer_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--:--:--");
              int total_seconds = (int)(x * 3600.0f);
              if (total_seconds < 0) total_seconds = 0;
              int hours = total_seconds / 3600;
              int minutes = (total_seconds % 3600) / 60;
              int seconds = total_seconds % 60;
              char buf[16];
              snprintf(buf, sizeof(buf), "%d:%02d:%02d", hours, minutes, seconds);
              return std::string(buf);
            text_color: !lambda |-
              // Turn red when over 2 hours
              if (x > 2.0f) return lv_color_hex(0xFF4444);
              return lv_color_hex(0xE0E0FF);
        # Map 0–2 hours to 0–100% arc, capped at 100%
        - lvgl.arc.update:
            id: timer_arc
            value: !lambda |-
              if (std::isnan(x)) return 0;
              int pct = (int)((x / 2.0f) * 100.0f);
              if (pct < 0) pct = 0;
              if (pct > 100) pct = 100;
              return pct;

# --- LVGL UI ---
lvgl:
  displays:
    - crowpanel_display
  touchscreens:
    - touchscreen_id: crowpanel_touch
  color_depth: 16
  buffer_size: 25%

  pages:
    - id: timer_page
      bg_color: 0x1A1A2E
      widgets:

        # --- Arc gauge around the timer ---
        - arc:
            id: timer_arc
            align: CENTER
            y: 5
            width: 220
            height: 220
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_color: 0x2A2A4A
            arc_width: 10
            indicator:
              arc_color: 0x00D4AA
              arc_width: 10
            knob:
              bg_opa: TRANSP

        # --- Timer value (large centered text) ---
        - label:
            id: timer_value
            align: CENTER
            y: -5
            text: "--:--:--"
            text_color: 0xE0E0FF
            text_font: montserrat_36

        # --- "On Time" subtitle ---
        - label:
            align: CENTER
            y: 30
            text: "On Time"
            text_color: 0x5555AA
            text_font: montserrat_14
